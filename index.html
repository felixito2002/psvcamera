<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsCam</title> <!-- Cambio del título del sitio web -->
<link rel="icon" href="https://www.shareicon.net/data/2015/09/25/106996_ps-vita_512x512.png" type="image/png"> <!-- Agregando el ícono -->
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #000;
    overflow: hidden; /* Evitar que la animación revele contenido antes de tiempo */
    position: relative;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0; /* Comienza con el video invisible */
  }

  #cameraSelect {
    position: absolute;
    top: 10px;
    left: 10px;
    background-color: #333;
    color: #fff;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    z-index: 10;
  }

  #cameraButton {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background-color: #333;
    color: #fff;
    border: none;
    padding: 5px 10px;
    cursor: pointer;
    opacity: 0; /* Comienza con el botón invisible */
    transition: opacity 0.3s;
  }

  #cameraButton:hover {
    opacity: 1;
  }
</style>
</head>
<body>
<select id="cameraSelect" onchange="changeCamera()"></select>
<video id="videoElement" autoplay></video>
<button id="cameraButton" onmouseover="showButton()" onmouseout="hideButton()" onclick="changeCamera()">Cambiar Cámara</button>

<script>
var videoElement = document.getElementById('videoElement');
var cameraSelect = document.getElementById('cameraSelect');
var currentStream;

// Función para listar las cámaras disponibles y poblar el menú desplegable
navigator.mediaDevices.enumerateDevices()
  .then(function(devices) {
    devices.forEach(function(device) {
      if (device.kind === 'videoinput') {
        var option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `Cámara ${cameraSelect.length + 1}`;
        cameraSelect.appendChild(option);
      }
    });
    // Seleccionar la primera cámara por defecto
    if (cameraSelect.length > 0) {
      startStream(cameraSelect.value);
    }
  })
  .catch(function(error) {
    console.error('Error al listar las cámaras:', error);
  });

// Función para iniciar el stream de la cámara seleccionada
function startStream(deviceId) {
  if (currentStream) {
    currentStream.getTracks().forEach(track => track.stop());
  }

  navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: deviceId } } })
    .then(function(stream) {
      currentStream = stream;
      videoElement.srcObject = stream;
      fadeIn(videoElement); // Agregar la animación gradual aquí
    })
    .catch(function(error) {
      console.error('Error al acceder a la cámara:', error);
    });
}

// Función para cambiar la cámara según la selección del usuario
function changeCamera() {
  startStream(cameraSelect.value);
}

// Función para hacer aparecer gradualmente el video
function fadeIn(element) {
  var opacity = 0;
  var interval = setInterval(function() {
    if (opacity < 1) {
      opacity += 0.05;
      element.style.opacity = opacity;
    } else {
      clearInterval(interval);
    }
  }, 100);
}

// Función para mostrar el botón
function showButton() {
  var button = document.getElementById('cameraButton');
  button.style.opacity = 1;
}

// Función para ocultar el botón
function hideButton() {
  var button = document.getElementById('cameraButton');
  button.style.opacity = 0;
}
</script>
</body>
</html>
